name: CI

# Type-checks, lints, builds, and runs the assert-based regression suite
# on every push - so a regression fails the build automatically, matching
# the pattern already used on ddkeyworth/ai-inbound-triage-agent and
# ddkeyworth/exampleco-ai-test.
#
# Requires two repo secrets under Settings -> Secrets and variables ->
# Actions - this workflow will fail until they're set, since Claude Code
# cannot add repo secrets on your behalf:
#   DATABASE_URL          - a Postgres connection string (the test scripts
#                            hit a real database, same as running them
#                            locally; none of them call the Anthropic API)
#   SECRET_ENCRYPTION_KEY  - see .env.example for how to generate one
#
# Deliberately does NOT include ANTHROPIC_API_KEY - no script in the
# assert-based suite calls the real API (prisma/test-full-pipeline.ts
# does, but that's a separate, manual verification tool, not part of
# this suite - see TESTING.md).

on:
  push:
    branches: [main]
    # A change that only touches documentation or screenshots cannot break the
    # app, so it does not need a full test run.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# Every run uses the same test database, so two runs at once would collide and
# slow each other down. This queues them: one at a time, none cancelled.
concurrency:
  group: ci-test-database
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_ENCRYPTION_KEY: ${{ secrets.SECRET_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        # Explicit, not relying on @prisma/client's own postinstall hook -
        # confirmed by reproducing this workflow's exact steps in a genuinely
        # fresh clone that relying on the implicit postinstall left the
        # generated client incomplete, cascading into dozens of unrelated
        # "implicitly has an 'any' type" errors.
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Build
        # Runs before the standalone Type-check step below, not after - Next.js
        # generates .next/types (needed for LayoutProps<"/"> in layout.tsx) as
        # part of building, and next build already runs its own type-check
        # internally. A real, reproduced failure: running tsc --noEmit before
        # this step fails with "Cannot find name 'LayoutProps'" in a genuinely
        # fresh checkout, since that type only exists once .next/types has
        # been generated at least once - invisible locally since a dev machine
        # that's already run npm run build has that folder sitting there
        # (gitignored, never committed) from a previous build.
        run: npm run build
      - name: Type-check
        run: npx tsc --noEmit
      - name: Sync the test database's tables
        # DATABASE_URL here points at a separate Neon branch (a copy of the demo
        # database used only by tests), never the live site's database. This
        # adds any tables or columns the code has gained since the copy was
        # made, so the copy can never fall out of date. db push without
        # --accept-data-loss refuses any change that would delete data.
        run: npx prisma db push --skip-generate
      # One step per test script, each with a time limit: a stuck test now fails
      # in 5 minutes and is named in the run, instead of hanging the whole job.
      - name: test-agent-action-review
        timeout-minutes: 5
        run: npx tsx prisma/test-agent-action-review.ts
      - name: test-agent-actions
        timeout-minutes: 5
        run: npx tsx prisma/test-agent-actions.ts
      - name: test-auth
        timeout-minutes: 5
        run: npx tsx prisma/test-auth.ts
      - name: test-calibration
        timeout-minutes: 5
        run: npx tsx prisma/test-calibration.ts
      - name: test-capability-batches
        timeout-minutes: 5
        run: npx tsx prisma/test-capability-batches.ts
      - name: test-capability-runs
        timeout-minutes: 5
        run: npx tsx prisma/test-capability-runs.ts
      - name: test-churn-model
        timeout-minutes: 5
        run: npx tsx prisma/test-churn-model.ts
      - name: test-csp
        timeout-minutes: 5
        run: npx tsx prisma/test-csp.ts
      - name: test-csv-parse-validate
        timeout-minutes: 5
        run: npx tsx prisma/test-csv-parse-validate.ts
      - name: test-demo-dates
        timeout-minutes: 5
        run: npx tsx prisma/test-demo-dates.ts
      - name: test-deployment-modes
        timeout-minutes: 5
        run: npx tsx prisma/test-deployment-modes.ts
      - name: test-health-layer2-guards
        timeout-minutes: 5
        run: npx tsx prisma/test-health-layer2-guards.ts
      - name: test-import-export
        timeout-minutes: 5
        run: npx tsx prisma/test-import-export.ts
      - name: test-import-mapping
        timeout-minutes: 5
        run: npx tsx prisma/test-import-mapping.ts
      - name: test-onboarding-pace
        timeout-minutes: 5
        run: npx tsx prisma/test-onboarding-pace.ts
      - name: test-pagination
        timeout-minutes: 5
        run: npx tsx prisma/test-pagination.ts
      - name: test-password-reset
        timeout-minutes: 5
        run: npx tsx prisma/test-password-reset.ts
      - name: test-rate-limit
        timeout-minutes: 5
        run: npx tsx prisma/test-rate-limit.ts
      - name: test-segments
        timeout-minutes: 5
        run: npx tsx prisma/test-segments.ts
      - name: test-settings-validation
        timeout-minutes: 5
        run: npx tsx prisma/test-settings-validation.ts
      - name: test-trial-gate
        timeout-minutes: 5
        run: npx tsx prisma/test-trial-gate.ts
      - name: test-workspace-scoping
        timeout-minutes: 5
        run: npx tsx prisma/test-workspace-scoping.ts
      - name: test-workspace-secret
        timeout-minutes: 5
        run: npx tsx prisma/test-workspace-secret.ts
      - name: test-custom-fields-use
        timeout-minutes: 5
        run: npx tsx prisma/test-custom-fields-use.ts
      - name: test-custom-fields
        timeout-minutes: 5
        run: npx tsx prisma/test-custom-fields.ts
