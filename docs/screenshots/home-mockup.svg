  <text x="230" y="408" font-size="11.5" fill="#6b6b66">Expansion pitch &#8211; consumption up 34% this quarter</text>
  <line x1="230" y1="422" x2="586" y2="422" stroke="#e5e5e0"/>
  <text x="230" y="444" font-size="12.5" fill="#1a1a18">Harlow &amp; Co</text>
