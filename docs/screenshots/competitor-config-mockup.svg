<svg viewBox="0 0 860 480" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Mockup: competitor risk configuration</title>
  <desc>Illustrative mockup, not a real screenshot. A Settings screen where a workspace admin configures up to 20 competitors with a risk weight each, and sees which detection signals are actually live versus concept-only.</desc>

  <rect x="0" y="0" width="860" height="480" rx="12" fill="#ffffff" stroke="#e5e5e0"/>

  <text x="30" y="38" font-size="15" font-weight="700" fill="#1a1a18">Settings &#8250; Competitor risk</text>
  <text x="30" y="60" font-size="12" fill="#6b6b66">Up to 20 competitors, each with a risk weight &#8211; not all competitors are equal threats.</text>

  <line x1="30" y1="76" x2="830" y2="76" stroke="#e5e5e0"/>
  <text x="30" y="98" font-size="11" fill="#6b6b66">Competitor</text>
  <text x="640" y="98" font-size="11" fill="#6b6b66">Risk weight</text>
  <line x1="30" y1="108" x2="830" y2="108" stroke="#e5e5e0"/>

  <text x="30" y="134" font-size="13" fill="#1a1a18">Northstar CS</text>
  <rect x="640" y="118" width="140" height="22" rx="6" fill="#fcebeb"/>
  <text x="654" y="134" font-size="11" fill="#791f1f">High (5/5)</text>
  <line x1="30" y1="146" x2="830" y2="146" stroke="#e5e5e0"/>

  <text x="30" y="172" font-size="13" fill="#1a1a18">Orbital Success</text>
  <rect x="640" y="156" width="140" height="22" rx="6" fill="#faeeda"/>
  <text x="654" y="172" font-size="11" fill="#633806">Medium (3/5)</text>
  <line x1="30" y1="184" x2="830" y2="184" stroke="#e5e5e0"/>

  <text x="30" y="210" font-size="13" fill="#1a1a18">RetainWorks</text>
  <rect x="640" y="194" width="140" height="22" rx="6" fill="#eaf3de"/>
  <text x="654" y="210" font-size="11" fill="#27500a">Low (1/5)</text>

  <rect x="30" y="248" width="800" height="80" rx="10" fill="#eaf3de"/>
  <text x="48" y="272" font-size="12.5" font-weight="700" fill="#27500a">Built and live: direct mentions + known-capability mentions</text>
  <text x="48" y="292" font-size="11.5" fill="#27500a">Detected by scanning interaction text already in the system (tickets, calls) &#8211;</text>
  <text x="48" y="310" font-size="11.5" fill="#27500a">no new outbound contact, no third-party dependency.</text>

  <rect x="30" y="340" width="800" height="100" rx="10" fill="#f7f7f5" stroke="#e5e5e0" stroke-dasharray="4 3"/>
  <text x="48" y="364" font-size="12.5" font-weight="700" fill="#6b6b66">Concept only: job postings + competitor website mentions</text>
  <text x="48" y="384" font-size="11.5" fill="#6b6b66">Would require monitoring genuinely new external sources (job boards, other</text>
  <text x="48" y="402" font-size="11.5" fill="#6b6b66">companies' websites) &#8211; not implemented, regardless of whether this list is</text>
  <text x="48" y="420" font-size="11.5" fill="#6b6b66">populated. Needs explicit sign-off before it's ever built for real.</text>
</svg>
